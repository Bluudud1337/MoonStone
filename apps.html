<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apps · MoonStone</title>
<link rel="icon" href="YOUR_ICON_URL_HERE">
<style>

:root {
  color-scheme: dark;
  --bg: #090909;
  --panel: #111110;
  --hover: #1b1b19;
  --text: #fffb9e;
  --muted: #c9c57b;
  --border: #39371e;
  --accent: #fffb9e;
  --particle: #fffb9e;
}

* {
  box-sizing: border-box;
}

html, body {
  width: 100%;
  min-height: 100%;
  margin: 0;
}

body {
  background-color: var(--bg);
  background-image: var(--wallpaper, none);
  background-size: cover;
  background-position: center center;
  background-attachment: fixed;
  background-repeat: no-repeat;
  color: var(--text);
  font-family: var(--site-font, Inter, ui-sans-serif, system-ui, -apple-system,
    BlinkMacSystemFont, "Segoe UI", sans-serif);
  overflow-x: hidden;
  transition: background .3s ease, color .3s ease;
}

button, input {
  font: inherit;
}

button {
  color: inherit;
}

button:focus-visible, a:focus-visible, input:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 4px;
}

#cursorTrail {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 10000;
  pointer-events: none;
  display: none;
}

#particles {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
  pointer-events: none;
  opacity: .92;
}

.sidebar, main, .modal-backdrop {
  position: relative;
  z-index: 1;
}

/* Themes */

body[data-theme="moonlight"] {
  --bg: #0c0e15;
  --panel: #131621;
  --hover: #202435;
  --text: #e4e9f5;
  --muted: #8c94a8;
  --border: #292e40;
  --accent: #c5d2f3;
  --particle: #b8c9ff;
}

body[data-theme="midnight"] {
  --bg: #080808;
  --panel: #101010;
  --hover: #1b1b1b;
  --text: #e8e8e8;
  --muted: #858585;
  --border: #292929;
  --accent: #bdbdbd;
  --particle: #a6a6a6;
}

body[data-theme="terminal"] {
  --bg: #000000;
  --panel: #050805;
  --hover: #0a190a;
  --text: #39ff14;
  --muted: #18b80b;
  --border: #14520b;
  --accent: #39ff14;
  --particle: #39ff14;
}

body[data-theme="garnet"] {
  --bg: #100709;
  --panel: #1a0d12;
  --hover: #2b121b;
  --text: #f5e8eb;
  --muted: #b28b96;
  --border: #47202d;
  --accent: #e16b88;
  --particle: #e16b88;
}

body[data-theme="paper"] {
  color-scheme: light;
  --bg: #eeeade;
  --panel: #e4e0d2;
  --hover: #d9d4c4;
  --text: #171714;
  --muted: #777469;
  --border: #d0cbbb;
  --accent: #24241f;
  --particle: #777469;
}

body[data-theme="astralsync"] {
  --bg: #070b18;
  --panel: #0d1428;
  --hover: #172342;
  --text: #e8edff;
  --muted: #8f9bc4;
  --border: #26365f;
  --accent: #7897ff;
  --particle: #9b83ff;
}

body[data-theme="eclipse"] {
  --bg: #080808;
  --panel: #140b05;
  --hover: #2a1407;
  --text: #fff0e3;
  --muted: #d18a59;
  --border: #66300f;
  --accent: #ff6a00;
  --particle: #ff7b00;
}

body[data-theme="void-purple"] {
  --bg: #000000;
  --panel: #08000d;
  --hover: #190022;
  --text: #f8eaff;
  --muted: #b68bc9;
  --border: #42105b;
  --accent: #c026ff;
  --particle: #d15cff;
}

body[data-theme="void-white"] {
  --bg: #000000;
  --panel: #080808;
  --hover: #1b1b1b;
  --text: #ffffff;
  --muted: #a6a6a6;
  --border: #3a3a3a;
  --accent: #ffffff;
  --particle: #f5f5f5;
}
[data-theme="flowery"] {
  --bg: #17120d;
  --panel: #211a13;
  --hover: #33271a;
  --text: #fff3d3;
  --muted: #d5b99a;
  --border: #675033;
  --accent: #f4d34e;
  --particle: #f4d34e;
  --wallpaper: linear-gradient(rgba(15, 11, 9, .48), rgba(15, 11, 9, .68)), url("https://i.redd.it/sarn4u1tl3ah1.png");
  --flowery-yellow: #f4d34e;
  --flowery-sunset: #f39a65;
  --flowery-green: #9bc66b;
}

body[data-theme="halloween"] {
  --bg: #120a08;
  --panel: #21120d;
  --hover: #352016;
  --text: #fff0dc;
  --muted: #d0a17d;
  --border: #59301b;
  --accent: #ff8a24;
  --particle: #ffb347;
  --wallpaper: linear-gradient(rgba(15, 7, 4, .48), rgba(15, 7, 4, .68)), url("https://media.istockphoto.com/id/2178349388/photo/halloween-background-for-party-invitation-orange-halloween-banner-or-background-with-cutest.jpg?s=612x612&w=0&k=20&c=RGwZEONmRUcLsRbRzBhKm1uSTOHjT25moHF9NBaHjFc=");
}

body[data-theme="frogies"] {
  --bg: #080b09;
  --panel: #151a16;
  --hover: #242b25;
  --text: #f0f3f0;
  --muted: #aab4aa;
  --border: #343d35;
  --accent: #38e65d;
  --particle: #57ff72;
  --wallpaper: radial-gradient(ellipse at 12% 10%, rgba(56, 230, 93, .10), transparent 34%), radial-gradient(ellipse at 88% 82%, rgba(56, 230, 93, .07), transparent 38%);
}

/* Sidebar */

.sidebar {
  position: fixed;
  left: 17px;
  top: 50%;
  transform: translateY(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 7px;
  padding: 9px;
  border: 1px solid var(--border);
  border-radius: 17px;
  background: color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter: blur(18px);
  z-index: 5;
}

.side-link, .side-button {
  width: 41px;
  height: 41px;
  display: grid;
  place-items: center;
  border: 0;
  border-radius: 11px;
  color: var(--muted);
  background: transparent;
  cursor: pointer;
  text-decoration: none;
  transition:
    color .2s ease,
    background .2s ease,
    transform .2s ease,
    box-shadow .2s ease;
}

.side-link:hover, .side-button:hover {
  color: var(--text);
  background: var(--hover);
  transform: scale(1.08);
  box-shadow: 0 0 18px color-mix(in srgb, var(--accent) 9%, transparent);
}

.side-link:active, .side-button:active {
  transform: scale(.92);
}

.side-link.active {
  color: var(--text);
  background: var(--hover);
}

.side-link svg, .side-button svg {
  width: 19px;
  height: 19px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.7;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.side-divider {
  width: 23px;
  height: 1px;
  background: var(--border);
  margin: 3px 0;
}

/* Homepage */

main {
  min-height: 100svh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 55px 24px;
}

.home {
  width: min(100%, 570px);
  animation: appear .65s ease both;
}

.brand {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  margin-bottom: 34px;
}

.brand-icon {
  width: 68px;
  height: 76px;
  display: block;
  flex-shrink: 0;
  color: var(--accent);
  transition: transform .35s ease, filter .35s ease, color .3s ease;
  filter: drop-shadow(0 0 5px color-mix(in srgb, var(--accent) 65%, transparent)) drop-shadow(0 0 15px color-mix(in srgb, var(--accent) 35%, transparent));
  animation: diamondGlow 3.2s ease-in-out infinite;
}
.brand-icon svg { display:block; width:100%; height:100%; overflow:visible; }
.brand-icon path {
  fill: none;
  stroke-linejoin: round;
  stroke-linecap: square;
}
.diamond-outline-shadow,.diamond-inner-shadow { stroke: var(--bg); stroke-width: 8; }
.diamond-outline,.diamond-inner { stroke: currentColor; stroke-width: 5.5; stroke-dasharray: 360; stroke-dashoffset: 360; animation: diamondDraw 1.5s cubic-bezier(.55,.05,.25,1) forwards; }
.diamond-inner { stroke-width: 5; animation-delay: .22s; }
.brand-icon:hover {
  transform: scale(1.06) rotate(-2deg);
  filter: drop-shadow(0 0 9px color-mix(in srgb, var(--accent) 85%, transparent)) drop-shadow(0 0 24px color-mix(in srgb, var(--accent) 55%, transparent));
}
.brand-icon { cursor: pointer; }
.brand-icon:focus-visible { outline: 2px solid var(--accent); outline-offset: 6px; border-radius: 8px; }
.brand-icon.is-bouncing { animation: diamondBounce .48s cubic-bezier(.34,1.56,.64,1); }
@keyframes diamondBounce {
  0% { transform: translateY(0) scale(1); }
  35% { transform: translateY(-13px) scale(1.08,.92); }
  65% { transform: translateY(2px) scale(.96,1.04); }
  100% { transform: translateY(0) scale(1); }
}
@keyframes diamondDraw { to { stroke-dashoffset: 0; } }
@keyframes diamondGlow {
  0%,100% { filter: drop-shadow(0 0 5px color-mix(in srgb, var(--accent) 55%, transparent)) drop-shadow(0 0 12px color-mix(in srgb, var(--accent) 25%, transparent)); }
  50% { filter: drop-shadow(0 0 9px color-mix(in srgb, var(--accent) 85%, transparent)) drop-shadow(0 0 22px color-mix(in srgb, var(--accent) 45%, transparent)); }
}
@media (prefers-reduced-motion: reduce) {
  .brand-icon,.brand-icon path { animation: none; stroke-dashoffset: 0; }
}

.brand h1 {
  margin: 0;
  font-size: 20px;
  font-weight: 550;
  letter-spacing: .24em;
  text-indent: .24em;
}

/* Random MoonStone message */
.brand-message {
  min-height: 36px;
  max-width: 100%;
  margin: -3px 0 0;
  color: var(--muted);
  font-size: 22px;
  line-height: 1.6;
  letter-spacing: .025em;
  text-align: center;
}
.brand-message-cursor {
  display: inline-block;
  width: 1px;
  height: .9em;
  margin-left: 2px;
  vertical-align: -1px;
  background: var(--accent);
  animation: messageBlink .85s steps(2, start) infinite;
}
@keyframes messageBlink {
  to { opacity: 0; }
}
@media (prefers-reduced-motion: reduce) {
  .brand-message-cursor { animation: none; }
}

.search {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  height: 54px;
  padding: 0 17px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 15px;
  transition: border-color .25s ease, box-shadow .25s ease,
    transform .25s ease, background .3s ease;
}

.search:focus-within {
  border-color: color-mix(in srgb, var(--accent) 55%, var(--border));
  box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 6%, transparent);
  transform: translateY(-2px);
}

.search svg {
  width: 19px;
  height: 19px;
  flex-shrink: 0;
  fill: none;
  stroke: var(--muted);
  stroke-width: 1.7;
  stroke-linecap: round;
}

.search input {
  flex: 1;
  min-width: 0;
  border: 0;
  outline: 0;
  background: transparent;
  color: var(--text);
  font-size: 14px;
}

.search input::placeholder {
  color: var(--muted);
}

.search input:focus-visible {
  outline: none;
}

.search-mode {
  padding: 6px 9px;
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--muted);
  background: transparent;
  font-size: 11px;
  cursor: pointer;
  transition: background .2s ease, color .2s ease;
  white-space: nowrap;
}

.search-mode:hover {
  color: var(--text);
  background: var(--hover);
}

.bookmarks {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 11px;
  margin-top: 17px;
}

.bookmark {
  min-width: 0;
  min-height: 77px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 10px;
  position: relative;
  padding: 12px 7px;
  border: 1px solid var(--border);
  border-radius: 13px;
  background: color-mix(in srgb, var(--panel) 92%, transparent);
  text-decoration: none;
  color: var(--muted);
  cursor: pointer;
  overflow: hidden;
  animation: appear .4s ease both;
  transition:
    transform .22s ease,
    background .22s ease,
    border-color .22s ease,
    color .22s ease,
    box-shadow .22s ease;
}

.bookmark:hover {
  transform: translateY(-4px);
  color: var(--text);
  background: var(--hover);
  border-color: color-mix(in srgb, var(--accent) 35%, var(--border));
  box-shadow: 0 9px 24px #00000014;
}

.bookmark:active {
  transform: translateY(-1px) scale(.97);
}

.bookmark-icon {
  width: 20px;
  height: 20px;
  display: grid;
  place-items: center;
  color: var(--accent);
  font-size: 17px;
}

.bookmark-icon svg {
  width: 20px;
  height: 20px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.6;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.bookmark-favicon-img{width:32px;height:32px;object-fit:contain;border-radius:8px}
.favicon-bookmarks .bookmarks{grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:12px}
.favicon-bookmarks .bookmark{min-height:102px;padding:12px 6px;border-color:transparent;background:transparent;gap:9px}
.favicon-bookmarks .bookmark:hover{background:var(--hover);border-color:var(--border);box-shadow:none;transform:translateY(-2px)}
.favicon-bookmarks .bookmark-icon{width:44px;height:44px;border-radius:12px;background:var(--panel);display:grid;place-items:center}
.favicon-bookmarks .bookmark-icon svg{width:24px;height:24px}
.favicon-bookmarks .bookmark-favicon-img{width:28px;height:28px}
.favicon-bookmarks .bookmark-name{font-size:12px;text-align:center}
.favicon-bookmarks .bookmark-remove{top:3px;right:3px}
.bookmark-name {
  max-width: 100%;
  font-size: 11px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.bookmark-remove {
  display: none;
  position: absolute;
  top: 5px;
  right: 5px;
  width: 21px;
  height: 21px;
  padding: 0;
  border: 0;
  border-radius: 7px;
  background: var(--bg);
  color: var(--muted);
  cursor: pointer;
}

.bookmark-remove:hover {
  color: var(--text);
}

.editing .bookmark-remove {
  display: grid;
  place-items: center;
}

.editing .bookmark {
  border-style: dashed;
}

/* Small action buttons */

.corner-actions {
  position: fixed;
  top: 17px;
  right: 18px;
  display: flex;
  gap: 7px;
  z-index: 5;
}

.small-button {
  width: 37px;
  height: 37px;
  display: grid;
  place-items: center;
  border: 1px solid var(--border);
  border-radius: 11px;
  background: var(--panel);
  color: var(--muted);
  cursor: pointer;
  transition: transform .2s ease, background .2s ease, color .2s ease;
}

.small-button:hover {
  color: var(--text);
  background: var(--hover);
  transform: translateY(-2px);
}

.small-button:active {
  transform: scale(.93);
}

.small-button svg {
  width: 17px;
  height: 17px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.7;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* Modals */

.modal-backdrop {
  position: fixed;
  inset: 0;
  z-index: 10;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: #0009;
  backdrop-filter: blur(7px);
}

.modal-backdrop.open {
  display: flex;
  animation: fadeIn .18s ease both;
}

.modal {
  width: min(100%, 410px);
  max-height: min(85svh, 650px);
  overflow-y: auto;
  padding: 23px;
  border: 1px solid var(--border);
  border-radius: 18px;
  background: var(--bg);
  box-shadow: 0 20px 80px #0005;
  animation: modalIn .22s ease both;
}

.modal-heading {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 23px;
}

.modal-heading h2 {
  margin: 0;
  font-size: 17px;
  font-weight: 550;
}

.close-button {
  width: 31px;
  height: 31px;
  border: 1px solid var(--border);
  border-radius: 9px;
  background: var(--panel);
  color: var(--muted);
  cursor: pointer;
  transition: background .2s ease, color .2s ease;
}

.close-button:hover {
  background: var(--hover);
  color: var(--text);
}

.section-label {
  margin: 19px 0 10px;
  color: var(--muted);
  font-size: 11px;
  letter-spacing: .08em;
  text-transform: uppercase;
}

.theme-list {
  display: grid;
  gap: 8px;
}

.theme-option {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  padding: 11px;
  border: 1px solid var(--border);
  border-radius: 11px;
  background: var(--panel);
  text-align: left;
  cursor: pointer;
  transition: border-color .2s ease, transform .2s ease, background .2s ease;
}

.theme-option:hover {
  transform: translateX(3px);
  background: var(--hover);
}

.theme-option.selected {
  border-color: var(--accent);
}

.theme-swatch {
  width: 36px;
  height: 36px;
  flex-shrink: 0;
  display: grid;
  place-items: center;
  border: 1px solid #7775;
  border-radius: 9px;
}

.swatch-dot {
  width: 11px;
  height: 11px;
  border-radius: 50%;
}

.theme-info {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.theme-info strong {
  font-size: 13px;
  font-weight: 500;
}

.theme-info span {
  color: var(--muted);
  font-size: 11px;
}

.theme-check {
  color: var(--accent);
  font-size: 15px;
}

.setting-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
  padding: 13px 0;
  border-bottom: 1px solid var(--border);
}

.setting-row:last-child {
  border-bottom: 0;
}

.setting-description {
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.setting-description strong {
  font-size: 13px;
  font-weight: 500;
}

.setting-description span {
  font-size: 11px;
  color: var(--muted);
}

.toggle {
  width: 39px;
  height: 23px;
  flex-shrink: 0;
  position: relative;
  padding: 0;
  border: 1px solid var(--border);
  border-radius: 20px;
  background: var(--hover);
  cursor: pointer;
  transition: background .2s ease;
}

.toggle::after {
  content: "";
  position: absolute;
  top: 3px;
  left: 3px;
  width: 15px;
  height: 15px;
  border-radius: 50%;
  background: var(--muted);
  transition: transform .2s ease, background .2s ease;
}

.toggle[aria-checked="true"] {
  background: var(--accent);
}

.toggle[aria-checked="true"]::after {
  background: var(--bg);
  transform: translateX(16px);
}

.field {
  width: 100%;
  margin-bottom: 11px;
  padding: 12px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--panel);
  color: var(--text);
  font-size: 13px;
}

.field::placeholder {
  color: var(--muted);
}

.primary-button {
  width: 100%;
  padding: 12px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--accent);
  color: var(--bg);
  font-size: 13px;
  cursor: pointer;
  transition: opacity .2s ease, transform .2s ease;
}

.primary-button:hover {
  opacity: .85;
  transform: translateY(-1px);
}

.modal-note {
  margin: 12px 0 0;
  color: var(--muted);
  font-size: 11px;
  line-height: 1.5;
}

.hidden {
  display: none !important;
}

@keyframes appear {
  from { opacity: 0; transform: translateY(9px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

@keyframes modalIn {
  from { opacity: 0; transform: translateY(8px) scale(.98); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

@media (max-width: 600px) {
  .sidebar {
    left: 50%;
    top: auto;
    bottom: 13px;
    transform: translateX(-50%);
    flex-direction: row;
    gap: 4px;
    padding: 6px;
  }

  .side-link, .side-button {
    width: 37px;
    height: 37px;
  }

  .side-divider {
    width: 1px;
    height: 22px;
    margin: 0 2px;
  }

  main {
    padding: 75px 20px 105px;
  }

  .bookmarks {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .bookmark {
    min-height: 72px;
  }

  .corner-actions {
    top: 12px;
    right: 12px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;

<script>
(() => {
 const $=s=>document.querySelector(s);
 let settings={};try{settings=JSON.parse(localStorage.getItem("moonstone-settings")||"{}")}catch{}
 const themes=["moonstone","moonlight","midnight","terminal","garnet","paper","astralsync","eclipse","void-purple","void-white","flowery","halloween","frogies"];
 document.body.dataset.theme=themes.includes(settings.theme)?settings.theme:"moonstone";
 document.body.dataset.dockPosition=["left","right","bottom"].includes(settings.dockPosition)?settings.dockPosition:"left";
 document.body.dataset.dockSpan=settings.dockSpan==="full"?"full":"compact";
 document.body.classList.toggle("no-particles",settings.particles===false);
 document.body.classList.toggle("no-animations",settings.animations===false);
 const font=(settings.siteFont||"").trim();
 if(font){document.documentElement.style.setProperty("--site-font",'"'+font.replace(/["\\]/g,"")+'", sans-serif');if(/^(Inter|Roboto|Open Sans|Lato|Montserrat|Poppins|Nunito|Roboto Mono|Space Grotesk|DM Sans|Outfit)$/i.test(font)){const l=document.createElement("link");l.rel="stylesheet";l.href="https://fonts.googleapis.com/css2?family="+encodeURIComponent(font).replace(/%20/g,"+")+":wght@400;500;600&display=swap";document.head.append(l)}}
 if(settings.cursorStyle==="cream")document.body.style.cursor="url('data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2224%22 height=%2224%22%3E%3Cpath fill=%22%23fffb9e%22 stroke=%22%23090909%22 d=%22M3 2l14 11-6 1-3 6z%22/%3E%3C/svg%3E') 3 2,auto";
 else if(settings.cursorStyle==="black")document.body.style.cursor="url('data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2224%22 height=%2224%22%3E%3Cpath fill=%22%23090909%22 stroke=%22%23fffb9e%22 d=%22M3 2l14 11-6 1-3 6z%22/%3E%3C/svg%3E') 3 2,auto";
 else if(settings.cursorStyle==="crosshair")document.body.style.cursor="crosshair";
 else if(settings.cursorStyle==="custom"&&settings.cursorImage)document.body.style.cursor='url("'+settings.cursorImage+'") 3 2,auto';
 else if(settings.cursorStyle==="link"&&settings.cursorImageUrl)document.body.style.cursor='url("'+settings.cursorImageUrl+'") 3 2,auto';
 const canvas=$("#particles"),ctx=canvas.getContext("2d");let ps=[],w=0,h=0,raf=0;
 function resize(){const dpr=Math.min(devicePixelRatio||1,1.5);w=innerWidth;h=innerHeight;canvas.width=w*dpr;canvas.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);ps=Array.from({length:Math.min(80,Math.floor(w*h/13000))},()=>({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.4+.5,vx:(Math.random()-.5)*.3,vy:(Math.random()-.5)*.3,a:Math.random()*.4+.25}))}
 function draw(){if(settings.particles===false||matchMedia("(prefers-reduced-motion: reduce)").matches)return;ctx.clearRect(0,0,w,h);ctx.fillStyle=getComputedStyle(document.body).getPropertyValue("--particle").trim()||"#fffb9e";ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;if(p.x<0)p.x=w;if(p.x>w)p.x=0;if(p.y<0)p.y=h;if(p.y>h)p.y=0;ctx.globalAlpha=p.a;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill()});ctx.globalAlpha=1;raf=requestAnimationFrame(draw)}
 resize();if(settings.particles!==false)draw();addEventListener("resize",resize);
 const input=$("#appSearch"),grid=$("#appsGrid"),count=$("#appsCount"),empty=$("#appsEmpty");
 input.addEventListener("input",()=>{const q=input.value.trim().toLowerCase();let shown=0;grid.querySelectorAll(".app-card").forEach(c=>{const yes=c.dataset.name.toLowerCase().includes(q);c.hidden=!yes;if(yes)shown++});count.textContent=shown+" app"+(shown===1?"":"s");empty.style.display=shown?"none":"block"});
})();
function openApp(url){const safe=new URL(url);if(!["http:","https:"].includes(safe.protocol))return;location.href="index.html?openApp="+encodeURIComponent(safe.href)}
</script>
