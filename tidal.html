<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Music · MoonStone</title>
<link rel="icon" href="YOUR_ICON_URL_HERE">
<link rel="stylesheet" href="moonstone-dock.css">
<style>
:root{color-scheme:dark;--bg:#090909;--panel:#111110;--text:#fffb9e;--muted:#c9c57b;--border:#39371e;--accent:#fffb9e}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}
body[data-theme=moonlight]{--bg:#0c0e15;--panel:#131621;--text:#e4e9f5;--muted:#8c94a8;--border:#292e40;--accent:#c5d2f3}
body[data-theme=midnight]{--bg:#080808;--panel:#101010;--text:#e8e8e8;--muted:#858585;--border:#292929;--accent:#bdbdbd}
body[data-theme=terminal]{--bg:#000;--panel:#050805;--text:#39ff14;--muted:#18b80b;--border:#14520b;--accent:#39ff14}
body[data-theme=cherry]{--bg:#0d0307;--panel:#17080d;--text:#ffe8ef;--muted:#a66b7b;--border:#3d1725;--accent:#ff4f83}
body[data-theme=garnet]{--bg:#100709;--panel:#1a0d12;--text:#f5e8eb;--muted:#b28b96;--border:#47202d;--accent:#e16b88}
body[data-theme=paper]{--bg:#eeeade;--panel:#e4e0d2;--text:#171714;--muted:#777469;--border:#d0cbbb;--accent:#24241f}
body[data-theme=astralsync]{--bg:#070b18;--panel:#0d1428;--text:#e8edff;--muted:#8f9bc4;--border:#26365f;--accent:#7897ff}
body[data-theme=eclipse]{--bg:#080808;--panel:#140b05;--text:#fff0e3;--muted:#d18a59;--border:#66300f;--accent:#ff6a00}
body[data-theme=void-purple]{--bg:#000;--panel:#08000d;--text:#f8eaff;--muted:#b68bc9;--border:#42105b;--accent:#c026ff}
body[data-theme=void-white]{--bg:#000;--panel:#080808;--text:#fff;--muted:#a6a6a6;--border:#3a3a3a;--accent:#fff}
body[data-theme=flowery]{--bg:#17120d;--panel:#211a13;--text:#fff3d3;--muted:#d5b99a;--border:#675033;--accent:#f4d34e}
body[data-theme=halloween]{--bg:#120a08;--panel:#21120d;--text:#fff0dc;--muted:#d0a17d;--border:#59301b;--accent:#ff8a24}
body[data-theme=frogies]{--bg:#080b09;--panel:#151a16;--text:#f0f3f0;--muted:#aab4aa;--border:#343d35;--accent:#38e65d}
#frame{position:fixed;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
#fallback{position:fixed;z-index:2;left:50%;top:16px;transform:translateX(-50%);display:none;align-items:center;gap:12px;padding:10px 14px;border:1px solid var(--border);border-radius:12px;background:var(--panel);color:var(--text);font-size:13px;box-shadow:0 8px 28px #0005}
#fallback a{color:var(--accent);font-weight:650;text-decoration:none}
</style>
</head>
<body>
<div id="moonstone-dock-root"></div>
<iframe id="frame" src="https://racialequityleadership.com/music-app/" title="MoonStone Music" allow="autoplay; encrypted-media; fullscreen; picture-in-picture" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
<div id="fallback">Music app not loading inside MoonStone? <a href="https://racialequityleadership.com/music-app/" target="_blank" rel="noopener noreferrer">Open Music</a></div>
<script>
(()=> {
  let settings={};try{settings=JSON.parse(localStorage.getItem("moonstone-settings")||"{}")}catch{}
  const themes=["moonstone","moonlight","midnight","terminal","garnet","cherry","paper","astralsync","eclipse","void-purple","void-white","flowery","halloween","frogies"];
  document.body.dataset.theme=themes.includes(settings.theme)?settings.theme:"moonstone";
  if(settings.siteFont)document.body.style.fontFamily='"'+String(settings.siteFont).replace(/["\\]/g,"")+'",system-ui,sans-serif';
  const frame=document.getElementById("frame");
  let loaded=false;
  frame.addEventListener("load",()=>{loaded=true});
  function applyTheme(){
    try{settings=JSON.parse(localStorage.getItem("moonstone-settings")||"{}")}catch{settings={}}
    document.body.dataset.theme=themes.includes(settings.theme)?settings.theme:"moonstone";
    if(settings.siteFont)document.body.style.fontFamily='"'+String(settings.siteFont).replace(/["\\]/g,"")+'",system-ui,sans-serif';
  }
  applyTheme();
  addEventListener("storage",e=>{if(e.key==="moonstone-settings")applyTheme()});
  addEventListener("focus",applyTheme);
  setTimeout(()=>{if(!loaded)document.getElementById("fallback").style.display="flex"},7000);
})();
</script>
<script src="moonstone-dock.js"></script>
</body>
</html>
