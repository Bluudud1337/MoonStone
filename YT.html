 <div class="topright"><span class="provider-status" id="providerStatus" data-provider="invidious" title="Active data provider: Invidious">Invidious</span><button class="iconbtn" id="tvModeBtn" type="button" aria-pressed="false" title="Switch to TV layout">TV layout</button><button class="iconbtn" id="refreshBtn" title="Refresh feed">↻</button><button class="iconbtn" id="homeBtn">MoonStone ↗</button></div>

 <button class="navbtn active" data-page="home"><span class="navico">⌂</span><span>Home</span></button>

 <div id="content"><div class="loading">Loading your recommendations…</div></div>

<script>
(()=>{
const instances=["https://inv.nadeko.net","https://invidious.nerdvpn.de","https://yt.chocolatemoo53.com","https://invidious.tiekoetter.com"];
const pipedInstances=["https://pipedapi.ducks.party","https://api.piped.private.coffee","https://pipedapi.adminforge.de","https://pipedapi.drgns.space","https://api.piped.yt","https://piped-api.codespace.cz","https://pipedapi.kavin.rocks","https://pipedapi-libre.kavin.rocks","https://pipedapi.nosebs.ru"];
const providers=[{id:"invidious",label:"Invidious",instances:instances},{id:"piped",label:"Piped",instances:pipedInstances}];
const providerCooldown=new Map();
let activeProvider="invidious",api=instances[0],page="home",category="default",currentVideo=null,feed=[],searchTerm="",currentPlaylist=null;
 let ytPlayerInstance=null,ytApiPromise=null,ytEndPoll=null;
const $=id=>document.getElementById(id),content=$("content"),chips=$("chips");
const get=(k,d=[])=>{try{return JSON.parse(localStorage.getItem("msyt_"+k)||"null")??d}catch{return d}};
const put=(k,v)=>localStorage.setItem("msyt_"+k,JSON.stringify(v));
let playlistAutoplay=get("playlist_autoplay",true);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>{n=Number(n)||0;return n>=1e9?(n/1e9).toFixed(1)+"B":n>=1e6?(n/1e6).toFixed(1)+"M":n>=1e3?(n/1e3).toFixed(1)+"K":String(n)};
const views=v=>{const candidates=[v?.viewCountText,v?.viewCountShort,v?.viewCountLabel,v?.views,v?.viewCount].filter(x=>x!==undefined&&x!==null&&String(x).trim()!=="");const parsed=candidates.map(raw=>{if(typeof raw==="number")return {raw,n:raw};const s=String(raw).trim();const m=s.match(/[\d,.]+\s*[KMB]?/i);if(!m)return {raw,n:NaN};let z=m[0].replace(/,/g,"").replace(/\s/g,"");const suffix=z.slice(-1).toUpperCase();let n=parseFloat(/[KMB]/.test(suffix)?z.slice(0,-1):z);if(suffix==="K")n*=1e3;if(suffix==="M")n*=1e6;if(suffix==="B")n*=1e9;return {raw,n}});const best=parsed.find(x=>Number.isFinite(x.n)&&x.n>0)||parsed.find(x=>Number.isFinite(x.n))||parsed[0];if(!best)return "Views unavailable";if(Number.isFinite(best.n))return fmt(best.n);return String(best.raw).replace(/\s*views?\s*$/i,"")};
const duration=n=>{n=Number(n)||0;return Math.floor(n/3600)?[Math.floor(n/3600),String(Math.floor(n/60)%60).padStart(2,"0"),String(n%60).padStart(2,"0")].join(":"):[Math.floor(n/60),String(n%60).padStart(2,"0")].join(":")};
const thumb=v=>{let a=v.videoThumbnails||[];return a.find(x=>x.quality==="maxres")?.url||a.find(x=>x.quality==="high")?.url||a[a.length-1]?.url||"https://i.ytimg.com/vi/"+v.videoId+"/hqdefault.jpg"};
const avatar=v=>v.authorThumbnails?.slice(-1)[0]?.url||"";
const isLive=v=>v?.liveNow===true||v?.isLive===true||v?.type==="stream"||v?.type==="livestream"||v?.liveBroadcastContent==="live";
const videoTitle=v=>{const value=[v?.title,v?.titleText,v?.videoTitle,v?.name].find(x=>typeof x==="string"&&x.trim());return value?.trim()||(isLive(v)?((v?.author||v?.authorName||"Channel")+" · Live"):((v?.author||"Video")+" · Untitled video"))};
function setProviderStatus(provider,base){
 const el=$("providerStatus");if(!el)return;
 const label=provider==="piped"?"Piped":"Invidious";
 el.textContent=label;el.title="Active data provider: "+label+" ("+base+")";el.dataset.provider=provider;
}
function pipedId(url){const value=String(url||"");return value.match(/[?&]v=([^&]+)/)?.[1]||value.match(/\/watch\/([a-zA-Z0-9_-]{11})/)?.[1]||""}
function pipedVideo(v){
 const id=v.videoId||pipedId(v.url)||v.id||"",thumbnail=v.thumbnail||v.thumbnailUrl||"";
 return {videoId:id,title:v.title||"Untitled video",author:v.uploader||v.uploaderName||v.author||"YouTube",authorId:(String(v.uploaderUrl||"").match(/\/channel\/([^/?]+)/)||[])[1]||"",authorThumbnails:v.uploaderAvatar?[{url:v.uploaderAvatar}]:[],videoThumbnails:thumbnail?[{quality:"high",url:thumbnail}]:[],viewCount:v.views??v.viewCount??0,lengthSeconds:v.duration||0,publishedText:v.uploadedDate||v.publishedText||"",type:v.type==="stream"?"stream":"video",liveNow:!!v.isLive};
}
async function fetchJson(url,fresh){
 const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),12000);
 try{const res=await fetch(url,{headers:{"Accept":"application/json"},cache:fresh?"no-store":"default",signal:controller.signal});if(!res.ok)throw Error("HTTP "+res.status);return await res.json()}
 finally{clearTimeout(timer)}
}
async function pipedRequest(path,base,fresh){
 const clean=path.replace(/([?&])_msfresh=\d+/,"$1").replace(/[?&]$/,"");
 let m=clean.match(/^\/api\/v1\/search\?(.*)$/);
 if(m){
  const params=new URLSearchParams(m[1]),q=params.get("q")||"",type=params.get("type")||"all";
  const fetchSearch=async filter=>{const d=await fetchJson(base+"/search?q="+encodeURIComponent(q)+"&filter="+filter,fresh);return Array.isArray(d)?d:(d?.items||d?.results||[])};
  const videos=await fetchSearch("videos");let channels=[];
  if(type==="all")channels=await fetchSearch("channels").catch(()=>[]);
  return videos.map(pipedVideo).filter(v=>v.videoId).concat(channels.map(c=>({type:"channel",author:c.name||c.uploader||c.title||"Channel",authorId:(String(c.url||c.uploaderUrl||"").match(/\/channel\/([^/?]+)/)||[])[1]||"",subCount:c.subscribers??c.subscriberCount??0,videoCount:c.videos??c.videoCount??0,authorThumbnails:c.thumbnail?[{url:c.thumbnail}]:c.uploaderAvatar?[{url:c.uploaderAvatar}]:[]})));
 }
 m=clean.match(/^\/api\/v1\/trending(?:\?(.*))?$/);
 if(m){const p=new URLSearchParams(m[1]||""),d=await fetchJson(base+"/trending?region="+encodeURIComponent(p.get("region")||"US"),fresh);return (Array.isArray(d)?d:[]).map(pipedVideo).filter(v=>v.videoId)}
 m=clean.match(/^\/api\/v1\/videos\/([^/?]+)/);
 if(m){const d=await fetchJson(base+"/streams/"+encodeURIComponent(m[1]),fresh);return {videoId:m[1],title:d.title||"Untitled video",author:d.uploader||"YouTube",authorId:(String(d.uploaderUrl||"").match(/\/channel\/([^/?]+)/)||[])[1]||"",authorThumbnails:d.uploaderAvatar?[{url:d.uploaderAvatar}]:[],videoThumbnails:d.thumbnailUrl?[{quality:"high",url:d.thumbnailUrl}]:[],viewCount:d.views||0,lengthSeconds:d.duration||0,description:d.description||"",recommendedVideos:(d.relatedStreams||[]).map(pipedVideo),liveNow:!!d.livestream,type:d.livestream?"stream":"video"}}
 m=clean.match(/^\/api\/v1\/channels\/([^/?]+)/);
 if(m){const d=await fetchJson(base+"/channel/"+encodeURIComponent(m[1]),fresh);return {author:d.name||"Channel",authorId:d.id||m[1],authorThumbnails:d.avatarUrl?[{url:d.avatarUrl}]:[],authorBanners:d.bannerUrl?[{url:d.bannerUrl}]:[],subCount:d.subscriberCount||0,description:d.description||"",videoCount:(d.relatedStreams||[]).length,latestVideos:(d.relatedStreams||[]).map(pipedVideo)}}
 m=clean.match(/^\/api\/v1\/playlists\/([^/?]+)/);
 if(m){const d=await fetchJson(base+"/playlists/"+encodeURIComponent(m[1]),fresh),videos=(d.relatedStreams||[]).map(pipedVideo);return {playlistId:m[1],title:d.name||"YouTube playlist",author:d.uploader||"",videoCount:d.videos||videos.length,videos}}
 m=clean.match(/^\/api\/v1\/comments\/([^/?]+)/);
 if(m){const d=await fetchJson(base+"/comments/"+encodeURIComponent(m[1]),fresh);return {comments:(d.comments||[]).map(c=>({author:c.author||"Unknown user",content:c.commentText||"",publishedText:c.commentedTime||"",likeCount:c.likeCount||0,pinned:!!c.pinned,authorThumbnails:c.thumbnail?[{url:c.thumbnail}]:[],authorIsChannelOwner:!!c.creatorReplied}))}}
 throw Error("Piped does not support this request yet.");
}
async function request(path,fresh=false){
 let last;
 const ordered=[...providers].sort((a,b)=>(a.id===activeProvider?-1:0)-(b.id===activeProvider?-1:0));
 for(const provider of ordered){
  for(const base of provider.instances){
   const key=provider.id+"|"+base;if((providerCooldown.get(key)||0)>Date.now())continue;
   try{
    let data;
    if(provider.id==="piped")data=await pipedRequest(path,base,fresh);
    else{const url=fresh?path+(path.includes("?")?"&":"?")+"_msfresh="+Date.now():path;data=await fetchJson(base+url,fresh)}
    activeProvider=provider.id;api=base;providerCooldown.delete(key);setProviderStatus(provider.id,base);return data;
   }catch(e){last=e;providerCooldown.set(key,Date.now()+45000)}
  }
 }
 throw Error("Video providers are temporarily unavailable. Moonstone tried Invidious and Piped. "+(last?.message||""));
}
function videoCard(v){const live=isLive(v);return `<article class="video" data-video="${esc(v.videoId)}"><div class="thumbwrap"><img class="thumb" loading="lazy" data-video-id="${esc(v.videoId)}" src="${esc(thumb(v))}" alt=""><span class="duration">${live?"LIVE":duration(v.lengthSeconds)}</span></div><div class="vrow"><img class="channelavatar" loading="lazy" src="${esc(avatar(v))}" alt=""><div><div class="vtitle">${esc(videoTitle(v))}</div><div class="vmeta">${esc(v.author||v.authorName||"YouTube")}<br>${live?"Live now":views(v)+" views"} · ${esc(v.publishedText||"")}</div></div></div></article>`}
function renderVideos(items,heading="Recommended"){
 feed=(Array.isArray(items)?items:[]).slice(0,30);
 content.innerHTML=`<div class="sectionhead"><h1>${esc(heading)}</h1><div class="feedtools"><span class="muted">${feed.length} videos</span>${page==="home"?'<button class="pill feedrefresh" id="refreshFeedBtn" type="button" title="Refresh recommendations">↻ Refresh</button>':""}</div></div><div class="grid">${feed.length?feed.map(videoCard).join(""):'<div class="empty">No videos found.</div>'}</div>`;
}
function setNav(p){document.querySelectorAll(".navbtn[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===p));}
async function home(forceRefresh=false){
 page="home";setNav(page);chips.classList.remove("hidden");content.innerHTML='<div class="loading">'+(forceRefresh?'Finding different videos…':'Building your recommendations…')+'</div>';
 try{
  const searches=get("searches",[]);
  const watched=get("history",[]);
  const refreshCount=forceRefresh?get("feed_refresh_count",0)+1:get("feed_refresh_count",0);
  if(forceRefresh)put("feed_refresh_count",refreshCount);
  const pageForQuery=idx=>forceRefresh?1+((refreshCount+idx-1)%5):1;
  const recommended=[],seen=new Set();
  const addVideos=group=>{
   if(recommended.length>=30)return;
   for(const v of (Array.isArray(group)?group:[])){
    if(recommended.length>=30)break;
    if(!v.videoId||seen.has(v.videoId))continue;
    if(v.type==="video"||v.type==="stream"||v.type==="livestream"||isLive(v)){seen.add(v.videoId);recommended.push(v)}
   }
  };
  // Turn searches and watch history into broad topic clues, not exact repeat searches.
  const stopWords=new Set(["the","and","for","with","from","that","this","you","your","are","was","how","why","what","when","where","who","can","could","would","should","about","into","onto","over","under","video","videos","youtube","watch","tutorial","full","official","2024","2025","2026"]);
  const tokenize=value=>String(value||"").toLowerCase().replace(/[^a-z0-9 ]/g," ").split(/\s+/).filter(w=>w.length>2&&!stopWords.has(w));
  const seeds=[
   ...watched.slice(0,12).map(v=>({text:[v.title,v.author].filter(Boolean).join(" "),weight:3})),
   ...searches.slice(0,8).map(v=>({text:typeof v==="string"?v:v?.query,weight:2}))
  ].filter(x=>x.text);
  const terms=new Map();
  seeds.forEach(seed=>tokenize(seed.text).forEach((word,index)=>{
   const entry=terms.get(word)||{score:0,first:index};
   entry.score+=seed.weight/(1+index*.25);
   terms.set(word,entry);
  }));
  const ranked=[...terms.entries()].sort((a,b)=>b[1].score-a[1].score).map(x=>x[0]);
  const modifiers=["ideas","explained","tips","best moments","deep dive","compilation","guide","highlights"];
  const relatedQueries=[];
  const addQuery=q=>{q=q.trim();if(q&&!relatedQueries.some(x=>x.toLowerCase()===q.toLowerCase()))relatedQueries.push(q)};
  // Mix topic pairs with different discovery angles so results aren't copies of the search page.
  ranked.slice(0,8).forEach((word,i)=>{
   const partner=ranked.find((other,j)=>j!==i&&!relatedQueries.some(q=>q.toLowerCase()===word+" "+other));
   const topic=partner?word+" "+partner:word;
   addQuery(topic+" "+modifiers[(i+refreshCount)%modifiers.length]);
  });
  if(category!=="default")addQuery(({music:"music discoveries and performances",gaming:"gameplay highlights and gaming tips",movies:"movie analysis and film scenes"})[category]||category+" videos");
  if(!relatedQueries.length){
   ["popular creators","interesting science discoveries","gaming highlights","music discoveries","funny moments"].forEach(addQuery);
  }
  const results=await Promise.all(relatedQueries.slice(0,6).map((q,idx)=>request("/api/v1/search?q="+encodeURIComponent(q)+"&type=video&page="+pageForQuery(idx)+"&region=US",forceRefresh).catch(()=>[])));
  results.forEach(addVideos);
  if(recommended.length<30){
   const trending=await request("/api/v1/trending?region=US&type="+encodeURIComponent(category),forceRefresh);
   addVideos(trending);
  }
  renderVideos(recommended,seeds.length?"Picked from your interests":"Trending videos");
 }catch(e){content.innerHTML='<div class="errorbox">'+esc(e.message)+'</div><div class="empty">The recommendation feed could not load. Try Refresh.</div>'}
}
function playlistIdFromInput(value){
 const raw=String(value||"").trim();
 if(!raw)return "";
 try{const u=new URL(raw);const host=u.hostname.toLowerCase();if(!(host==="youtube.com"||host.endsWith(".youtube.com")||host==="youtu.be"||host.endsWith(".youtu.be")))return "";return u.searchParams.get("list")||""}
 catch{return /^[A-Za-z0-9_-]{10,}$/.test(raw)?raw:""}
}
function playlistCard(p){
 const first=p.videos?.[0]||{};
 const image=first.videoThumbnails?.slice?.(-1)?.[0]?.url||"https://i.ytimg.com/vi/"+encodeURIComponent(first.videoId||"")+"/hqdefault.jpg";
 return '<article class="channelcard" data-open-playlist="'+esc(p.id)+'"><img style="width:112px;height:64px;border-radius:9px" src="'+esc(image)+'" alt=""><div><strong>'+esc(p.title||"Untitled playlist")+'</strong><span class="muted">'+fmt(p.videoCount||p.videos?.length||0)+' videos · '+esc(p.author||"YouTube playlist")+'</span></div></article>';
}
function renderUserPlaylists(){
 const lists=get("playlists",[]).filter(p=>p.kind==="user");
 content.innerHTML='<div class="sectionhead"><div><h1>Your playlists</h1><span class="muted">'+lists.length+' playlists</span></div><button class="pill" id="createPlaylistBtn">＋ Create playlist</button></div><div class="grid">'+(lists.length?lists.map(p=>'<article class="channelcard" data-user-playlist="'+esc(p.id)+'"><div class="playlistcover">▤</div><div class="playlistinfo"><strong>'+esc(p.title)+'</strong><span class="muted">'+p.videos.length+' videos</span></div></article>').join(""):'<div class="empty">Create a playlist to start collecting videos.</div>')+'</div>';
 $("createPlaylistBtn").onclick=createPlaylist;
}
function createPlaylist(){
 const name=prompt("Name your playlist:");
 if(!name||!name.trim())return;
 const lists=get("playlists",[]);
 const item={id:"user-"+Date.now().toString(36),kind:"user",title:name.trim().slice(0,80),videos:[],createdAt:Date.now()};
 lists.unshift(item);put("playlists",lists);renderUserPlaylists();toast("Playlist created");
}
function openUserPlaylist(id){
 const p=get("playlists",[]).find(x=>x.id===id&&x.kind==="user");if(!p)return;
 currentPlaylist=p;page="playlist";setNav("playlists");chips.classList.add("hidden");
 content.innerHTML='<button class="pill back" id="userPlaylistBack">← Playlists</button><div class="sectionhead"><div><h1>'+esc(p.title)+'</h1><span class="muted">'+p.videos.length+' videos</span></div><div class="feedtools"><button class="pill" id="renamePlaylistBtn">Rename</button><button class="pill" id="deletePlaylistBtn">Delete</button><button class="pill" id="playUserPlaylistBtn" '+(p.videos.length?'':'disabled')+'>▶ Play all</button></div></div><div class="grid">'+(p.videos.length?p.videos.map((v,i)=>'<article class="video" data-video="'+esc(v.videoId||v.id)+'" data-user-playlist-index="'+i+'"><div class="thumbwrap"><img class="thumb" src="'+esc(v.thumb||("https://i.ytimg.com/vi/"+v.id+"/hqdefault.jpg"))+'"><span class="duration">'+duration(v.lengthSeconds)+'</span></div><div class="vrow"><div><div class="vtitle">'+esc(v.title)+'</div><div class="vmeta">'+esc(v.author||"YouTube")+'</div><button class="pill removePlaylistVideo" data-remove-index="'+i+'">Remove</button></div></div></article>').join(""):'<div class="empty">This playlist is empty. Open a video and choose “Add to playlist”.</div>')+'</div>';
 $("userPlaylistBack").onclick=renderUserPlaylists;
 $("playUserPlaylistBtn").onclick=()=>{if(p.videos[0])watch(p.videos[0].videoId||p.videos[0].id,0)};
 $("renamePlaylistBtn").onclick=()=>{const n=prompt("New playlist name:",p.title);if(n&&n.trim()){p.title=n.trim().slice(0,80);put("playlists",get("playlists",[]).map(x=>x.id===p.id?p:x));openUserPlaylist(p.id)}};
 $("deletePlaylistBtn").onclick=()=>{if(confirm('Delete "'+p.title+'"?')){put("playlists",get("playlists",[]).filter(x=>x.id!==p.id));currentPlaylist=null;renderUserPlaylists();toast("Playlist deleted")}};
 content.querySelectorAll(".removePlaylistVideo").forEach(btn=>btn.onclick=e=>{e.stopPropagation();const index=Number(btn.dataset.removeIndex);p.videos.splice(index,1);put("playlists",get("playlists",[]).map(x=>x.id===p.id?p:x));openUserPlaylist(p.id)});
}
function addVideoToPlaylist(v){
 const lists=get("playlists",[]).filter(p=>p.kind==="user");
 if(!lists.length){if(confirm("You don't have a playlist yet. Create one now?")){createPlaylist();}return}
 const choice=prompt("Add to which playlist?\n"+lists.map((p,i)=>(i+1)+". "+p.title).join("\n")+"\n\nEnter a number:");
 const index=Number(choice)-1;if(!Number.isInteger(index)||index<0||index>=lists.length)return;
 const p=lists[index];if(p.videos.some(x=>x.id===v.videoId)){toast("Already in that playlist");return}
 p.videos.push({id:v.videoId,videoId:v.videoId,title:videoTitle(v),author:v.author,thumb:thumb(v),lengthSeconds:v.lengthSeconds});
 put("playlists",get("playlists",[]).map(x=>x.id===p.id?p:x));toast("Added to "+p.title);
}
async function playlist(id){
 page="playlist";setNav("");chips.classList.add("hidden");content.innerHTML='<div class="loading">Loading playlist…</div>';
 try{
  const p=await request("/api/v1/playlists/"+encodeURIComponent(id));
  const videos=Array.isArray(p.videos)?p.videos:[];
  currentPlaylist={id:p.playlistId||id,title:p.title||"YouTube playlist",author:p.author||"",videoCount:p.videoCount||videos.length,videos};
  const saved=get("playlists",[]),isSaved=saved.some(x=>x.id===currentPlaylist.id);
  content.innerHTML='<button class="pill back" id="playlistBack">← Back</button><div class="sectionhead"><div><h1>'+esc(currentPlaylist.title)+'</h1><span class="muted">'+esc(currentPlaylist.author)+' · '+videos.length+' loaded videos</span></div><div class="feedtools"><button class="pill" id="playAllBtn" '+(videos.length?'':'disabled')+'>▶ Play all</button><button class="pill" id="savePlaylistBtn">'+(isSaved?'Saved ✓':'＋ Save playlist')+'</button></div></div><div class="grid">'+(videos.length?videos.map((v,i)=>videoCard(v).replace('class="video"','class="video" data-playlist-index="'+i+'"')).join(""):'<div class="empty">This playlist has no available videos.</div>')+'</div>';
  $("playlistBack").onclick=()=>home();
  $("playAllBtn").onclick=()=>{if(videos[0]?.videoId)watch(videos[0].videoId,0)};
  $("savePlaylistBtn").onclick=()=>{let list=get("playlists",[]);if(list.some(x=>x.id===currentPlaylist.id)){list=list.filter(x=>x.id!==currentPlaylist.id);$("savePlaylistBtn").textContent="＋ Save playlist"}else{list.unshift({id:currentPlaylist.id,title:currentPlaylist.title,author:currentPlaylist.author,videoCount:currentPlaylist.videoCount,videos});$("savePlaylistBtn").textContent="Saved ✓"}put("playlists",list)};
 }catch(e){content.innerHTML='<div class="errorbox">'+esc(e.message)+'</div><button class="pill" id="playlistRetry">Retry</button>'; $("playlistRetry").onclick=()=>playlist(id)}
}
async function search(q){
 page="search";searchTerm=q;setNav("");chips.classList.add("hidden");content.innerHTML='<div class="loading">Searching YouTube…</div>';
 const searches=get("searches",[]);
 put("searches",[{query:q,time:Date.now()},...searches.filter(x=>(typeof x==="string"?x:x?.query||"").toLowerCase()!==q.toLowerCase())].slice(0,20));
 try{const data=await request("/api/v1/search?q="+encodeURIComponent(q)+"&type=all&page=1&region=US");
 const videos=data.filter(x=>x.type==="video"||x.type==="stream"||x.type==="livestream"||isLive(x)),channels=data.filter(x=>x.type==="channel");
 content.innerHTML='<div class="sectionhead"><h1>Search results</h1><span class="muted">'+esc(q)+'</span></div>'+
 (channels.length?'<h3>Channels</h3><div class="grid" style="margin-bottom:28px">'+channels.map(c=>`<article class="channelcard" data-channel="${esc(c.authorId)}"><img src="${esc(avatar(c))}" alt=""><div><strong>${esc(c.author)}</strong><span class="muted">${fmt(c.subCount)} subscribers · ${fmt(c.videoCount)} videos</span></div></article>`).join("")+'</div>':'')+
 '<h3>Videos</h3><div class="grid">'+(videos.length?videos.map(videoCard).join(""):'<div class="empty">No matching videos.</div>')+'</div>';
 }catch(e){content.innerHTML='<div class="errorbox">'+esc(e.message)+'</div>'}
}
async function channel(id){
 page="channel";chips.classList.add("hidden");content.innerHTML='<div class="loading">Loading channel…</div>';
 try{const c=await request("/api/v1/channels/"+encodeURIComponent(id));
 const saved=get("channels",[]).some(x=>x.id===c.authorId);
 const vids=c.latestVideos||[];
 content.innerHTML=(c.authorBanners?.length?'<div class="channelbanner"><img src="'+esc(c.authorBanners[0].url)+'"></div>':'')+
 '<div class="channelhero"><img class="channelavatar" src="'+esc(avatar(c))+'"><div><h1>'+esc(c.author)+'</h1><p>'+fmt(c.subCount)+' subscribers · '+fmt(vids.length||c.videoCount)+' videos</p><p>'+esc((c.description||"").slice(0,190))+'</p></div><button class="pill savebtn" id="followBtn">'+(saved?"Following ✓":"Subscribe +")+'</button></div>'+
 '<div class="sectionhead"><h1>Videos</h1></div><div class="grid">'+(vids.length?vids.map(videoCard).join(""):'<div class="empty">No recent videos listed.</div>')+'</div>';
 $("followBtn").onclick=()=>{let list=get("channels",[]);if(saved)list=list.filter(x=>x.id!==c.authorId);else list.unshift({id:c.authorId,name:c.author,avatar:avatar(c)});put("channels",list);$("followBtn").textContent=saved?"Subscribe +":"Following ✓";renderSubscriptions()};
 }catch(e){content.innerHTML='<div class="errorbox">'+esc(e.message)+'</div>'}
}
function loadYouTubeIframeAPI(){
  if(window.YT&&window.YT.Player)return Promise.resolve(window.YT);
  if(ytApiPromise)return ytApiPromise;
  ytApiPromise=new Promise((resolve,reject)=>{
   const previous=window.onYouTubeIframeAPIReady;
   window.onYouTubeIframeAPIReady=()=>{try{if(typeof previous==="function")previous()}catch(e){};resolve(window.YT)};
   let script=document.querySelector('script[data-ms-youtube-iframe-api]');
   if(!script){script=document.createElement("script");script.src="https://www.youtube.com/iframe_api";script.async=true;script.dataset.msYoutubeIframeApi="1";script.onerror=()=>reject(Error("YouTube player API could not load"));document.head.appendChild(script)}
   setTimeout(()=>{if(!(window.YT&&window.YT.Player))reject(Error("YouTube player API timed out"))},12000);
  });
  return ytApiPromise;
 }
 function setPlaylistAutoplay(enabled){
  playlistAutoplay=!!enabled;put("playlist_autoplay",playlistAutoplay);
  const button=$("playlistAutoplayBtn");
  if(button){button.textContent="Autoplay: "+(playlistAutoplay?"On":"Off");button.setAttribute("aria-pressed",String(playlistAutoplay))}
 }
 async function watch(id,playlistIndex){
 if(playlistIndex===undefined){const found=currentPlaylist?.videos?.findIndex(v=>v.videoId===id)??-1;if(found<0)currentPlaylist=null;else playlistIndex=found}
 if(ytEndPoll){clearInterval(ytEndPoll);ytEndPoll=null}
 page="watch";chips.classList.add("hidden");content.innerHTML='<div class="loading">Loading video…</div>';
 try{
  const v=await request("/api/v1/videos/"+encodeURIComponent(id));currentVideo=v;
  const rec=v.recommendedVideos||[];
  const channelId=v.authorId||"";
  const inPlaylist=!!currentPlaylist&&Number.isInteger(playlistIndex)&&playlistIndex>=0&&playlistIndex<currentPlaylist.videos.length;
  const previous=inPlaylist&&playlistIndex>0?currentPlaylist.videos[playlistIndex-1]:null;
  const next=inPlaylist&&playlistIndex<currentPlaylist.videos.length-1?currentPlaylist.videos[playlistIndex+1]:null;
  put("history",[{id,title:videoTitle(v),author:v.author,thumb:thumb(v),lengthSeconds:v.lengthSeconds},...get("history",[]).filter(x=>x.id!==id)].slice(0,80));
  content.innerHTML='<button class="pill back" id="backBtn">← Back</button><div class="watchlayout"><div><div class="playerShell" id="playerShell"><div class="player" id="ytPlayer"></div><button class="videoFullscreenBtn" id="fullscreenBtn" type="button" title="Fullscreen">⛶</button></div><div class="playercontrols">'+(inPlaylist?'<button id="prevPlaylistBtn" type="button" '+(previous?'':'disabled')+'>← Previous</button><button id="nextPlaylistBtn" type="button" '+(next?'':'disabled')+'>Next →</button><button id="playlistAutoplayBtn" type="button" aria-pressed="'+(playlistAutoplay?'true':'false')+'">Autoplay: '+(playlistAutoplay?'On':'Off')+'</button>':'')+'</div><h2 class="watchtitle">'+esc(videoTitle(v))+'</h2><div class="watchmeta"><div class="channelline"><img class="channelavatar" src="'+esc(avatar(v))+'"><div><strong>'+esc(v.author)+'</strong><small>'+fmt(v.subCount)+' subscribers</small></div><button class="pill" id="watchChannel">View channel</button></div><div class="actions"><button class="pill" id="saveVideo">＋ Save</button><button class="pill" id="addToPlaylist">＋ Playlist</button><button class="pill" id="openNative">Open player ↗</button></div></div><div class="description">'+views(v)+' views · '+esc(v.publishedText||"")+'\n\n'+esc(v.description||"")+'</div><section class="comments" id="commentsSection"><div class="commentshead"><h3>Comments</h3><span class="muted">Read-only</span></div><div class="commentstate">Loading comments…</div></section></div><aside class="related"><h3>Up next</h3>'+(rec.length?rec.map(videoCard).join(""):'<p class="muted">No related videos available.</p>')+'</aside></div>';
  $("backBtn").onclick=()=>{if(currentPlaylist?.kind==="user")openUserPlaylist(currentPlaylist.id);else if(currentPlaylist)playlist(currentPlaylist.id);else home()};
  if(ytPlayerInstance){try{ytPlayerInstance.destroy()}catch(e){};ytPlayerInstance=null}
  if(inPlaylist){
   $("prevPlaylistBtn").onclick=()=>{if(previous)watch(previous.videoId||previous.id,playlistIndex-1)};
   $("nextPlaylistBtn").onclick=()=>{if(next)watch(next.videoId||next.id,playlistIndex+1)};
   $("playlistAutoplayBtn").onclick=()=>setPlaylistAutoplay(!playlistAutoplay);
  }
  $("fullscreenBtn").onclick=async()=>{const player=$("playerShell");try{if(document.fullscreenElement)await document.exitFullscreen();else if(player.requestFullscreen)await player.requestFullscreen();else throw Error("Unsupported")}catch(e){toast("Fullscreen is not available in this browser")}};
  try{
   const YTApi=await loadYouTubeIframeAPI();
   if(page!=="watch"||currentVideo?.videoId!==id)return;
   let advanceStarted=false;
   const advancePlaylist=()=>{
    if(advanceStarted||!inPlaylist||!playlistAutoplay||!next)return;
    advanceStarted=true;
    if(ytEndPoll){clearInterval(ytEndPoll);ytEndPoll=null}
    watch(next.videoId||next.id,playlistIndex+1);
   };
   ytPlayerInstance=new YTApi.Player("ytPlayer",{
    videoId:id,
    playerVars:{autoplay:1,mute:1,playsinline:1,rel:0,origin:location.origin},
    events:{
     onReady:event=>{try{event.target.playVideo()}catch(e){}},
     onStateChange:event=>{if(event.data===YTApi.PlayerState.ENDED)advancePlaylist()},
     onError:event=>{toast("YouTube player error ("+event.data+"). Try Open player.")}
    }
   });
   if(inPlaylist&&next){
    ytEndPoll=setInterval(()=>{
     if(!ytPlayerInstance||advanceStarted)return;
     try{if(ytPlayerInstance.getPlayerState()===YTApi.PlayerState.ENDED)advancePlaylist()}catch(e){}
    },500);
   }
  }catch(playerError){
   const mount=$("ytPlayer");
   if(mount)mount.outerHTML='<iframe class="player" id="ytPlayer" src="https://www.yout-ube.com/watch?v='+encodeURIComponent(id)+'&autoplay=1&mute=1" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>';
   if(inPlaylist)toast("Autoplay detection unavailable. Playlist controls still work.");
  }
  $("watchChannel").onclick=()=>channel(channelId);
  $("saveVideo").onclick=()=>{let list=get("saved",[]);if(!list.some(x=>x.id===id)){list.unshift({id,title:videoTitle(v),author:v.author,thumb:thumb(v),lengthSeconds:v.lengthSeconds});put("saved",list)}toast("Saved to your videos")};
  $("addToPlaylist").onclick=()=>addVideoToPlaylist(v);
  $("openNative").onclick=()=>window.open("https://www.yout-ube.com/watch?v="+encodeURIComponent(id),"_blank","noopener");
  loadComments(id);
 }catch(e){content.innerHTML='<div class="errorbox">'+esc(e.message)+'</div><button class="pill" onclick="location.reload()">Retry</button>'}
}
function plainCommentText(value){
 return String(value||"")
  .replace(/<br\s*\/?\s*>/gi,"\n")
  .replace(/<\/p>\s*<p[^>]*>/gi,"\n\n")
  .replace(/<[^>]*>/g,"")
  .replace(/&amp;/g,"&").replace(/&lt;/g,"<").replace(/&gt;/g,">")
  .replace(/&quot;/g,'"').replace(/&#39;|&apos;/g,"'").trim();
}
function commentAvatarUrl(c){
 const raw=c?.authorThumbnails?.slice?.(-1)?.[0]?.url||"";
 if(!raw)return "";
 if(raw.startsWith("//"))return "https:"+raw;
 if(raw.startsWith("/"))return api+raw;
 return raw;
}
async function loadComments(id){
 const target=$("commentsSection");if(!target)return;
 try{
  const data=await request("/api/v1/comments/"+encodeURIComponent(id));
  if(!$("commentsSection"))return;
  const list=Array.isArray(data)?data:(data?.comments||[]);
  const state=target.querySelector(".commentstate");
  if(!list.length){state.textContent="No comments available for this video.";return}
  target.querySelector(".commentshead h3").textContent="Comments ("+fmt(list.length)+")";
  state.outerHTML='<div class="commentlist">'+list.map(c=>{
   const avatarUrl=commentAvatarUrl(c);
   const authorName=c.author||"Unknown user";
   const initials=authorName.trim().split(/\\s+/).slice(0,2).map(x=>x[0]||"").join("").toUpperCase()||"?";
   const text=plainCommentText(c.content||c.commentText||c.text);
   const avatarMarkup='<span class="commentavatarwrap"><span class="commentavatarfallback" aria-hidden="true">'+esc(initials)+'</span>'+(avatarUrl?'<img class="commentavatar" loading="lazy" referrerpolicy="no-referrer" src="'+esc(avatarUrl)+'" alt="" onerror="this.hidden=true">':'')+'</span>';
   return '<article class="comment">'+avatarMarkup+'<div class="commentbody"><div class="commentbyline"><span class="commentauthor">'+esc(authorName)+'</span><span class="commentdate">'+esc(c.publishedText||"")+'</span>'+(c.authorIsChannelOwner?'<span class="commentbadge">Creator</span>':'')+(c.pinned?'<span class="commentbadge">Pinned</span>':'')+'</div><div class="commenttext">'+esc(text)+'</div>'+(Number(c.likeCount)>0?'<div class="commentlikes">♥ '+fmt(c.likeCount)+'</div>':'')+'</div></article>';
  }).join("")+'</div>';
 }catch(e){const state=target.querySelector(".commentstate");if(state)state.textContent="Comments could not be loaded right now."}
}
function toast(t){let el=document.createElement("div");el.className="toast";el.textContent=t;document.body.append(el);setTimeout(()=>el.remove(),1800)}
function renderSubscriptions(){
 const list=get("channels",[]);$("subscriptionList").innerHTML=list.length?list.map(c=>'<div class="subitem" data-channel="'+esc(c.id)+'"><img class="avatar" src="'+esc(c.avatar)+'">'+esc(c.name)+'</div>').join(""):'Follow channels to see them here.';
}

 content.innerHTML='<div class="sectionhead"><h1>'+label+'</h1><span class="muted">'+list.length+' videos</span></div><div class="grid">'+(list.length?list.map(v=>'<article class="video" data-video="'+esc(v.id)+'"><div class="thumbwrap"><img class="thumb" src="'+esc(v.thumb)+'"><span class="duration">'+duration(v.lengthSeconds)+'</span></div><div class="vrow"><div><div class="vtitle">'+esc(v.title)+'</div><div class="vmeta">'+esc(v.author)+'</div></div></div></article>').join(""):'<div class="empty">Nothing here yet.</div>')+'</div>';
}
document.querySelectorAll(".navbtn[data-page]").forEach(b=>b.addEventListener("click",()=>{const p=b.dataset.page;if(p==="home")home();else if(p==="subscriptions"){page="subscriptions";setNav(page);chips.classList.add("hidden");const list=get("channels",[]);if(!list.length){content.innerHTML='<div class="empty">Subscribe to channels to build your feed.</div>';return}Promise.all(list.map(c=>request("/api/v1/channels/"+encodeURIComponent(c.id)).catch(()=>null))).then(cs=>renderVideos(cs.filter(Boolean).flatMap(c=>c.latestVideos||[]),"Your subscriptions"))}else if(p==="playlists"){page="playlists";setNav(page);chips.classList.add("hidden");renderUserPlaylists()}else localList(p,p==="history"?"Watch history":"Saved videos")}));

chips.addEventListener("click",e=>{const b=e.target.closest("[data-category]");if(!b)return;category=b.dataset.category;document.querySelectorAll(".chip").forEach(x=>x.classList.toggle("active",x===b));home()});
content.addEventListener("click",e=>{
 if(e.target.closest("#refreshFeedBtn")){home(true);return}
 const pl=e.target.closest("[data-open-playlist]");
 if(pl){const saved=get("playlists",[]).find(x=>x.id===pl.dataset.openPlaylist);if(saved?.kind==="user"){openUserPlaylist(saved.id)}else if(saved?.videos?.length){currentPlaylist={...saved};page="playlist";setNav("");chips.classList.add("hidden");content.innerHTML='<div class="sectionhead"><h1>'+esc(saved.title)+'</h1></div><div class="grid">'+saved.videos.map((v,i)=>videoCard(v).replace('class="video"','class="video" data-playlist-index="'+i+'"')).join("")+'</div>'}else playlist(pl.dataset.openPlaylist);return}
 const userPl=e.target.closest("[data-user-playlist]");if(userPl){openUserPlaylist(userPl.dataset.userPlaylist);return}
 const v=e.target.closest("[data-video]"),c=e.target.closest("[data-channel]");
 if(v){const idx=v.dataset.playlistIndex??v.dataset.userPlaylistIndex;watch(v.dataset.video,idx===undefined?undefined:Number(idx))}else if(c)channel(c.dataset.channel);

$("subscriptionList").addEventListener("click",e=>{const c=e.target.closest("[data-channel]");if(c)channel(c.dataset.channel)});
const moonstoneThemeIds=["moonstone","moonlight","midnight","terminal","cherry","garnet","paper","flowery","astralsync","halloween","frogies","eclipse","void-purple","void-white","youtube","nightmare"];
function applyMoonstoneSettings(){
 try{
  const s=JSON.parse(localStorage.getItem("moonstone-settings")||"{}");
  const theme=moonstoneThemeIds.includes(s.theme)?s.theme:"moonstone";
  document.body.dataset.theme=theme;
  document.body.dataset.cursor=s.cursorStyle||"default";
  document.documentElement.dataset.theme=theme;
  const font=typeof s.siteFont==="string"?s.siteFont.trim().slice(0,60):"";
  if(font&&font.toLowerCase()!=="default"){
   const safeFont=font.split('"').join("").split("\\").join("");
   document.documentElement.style.setProperty("--site-font",'"'+safeFont+'",Inter,Arial,sans-serif');
   const systemFonts=["Arial","Verdana","Georgia","Trebuchet MS","Courier New"];
   if(!systemFonts.some(x=>x.toLowerCase()===font.toLowerCase())){
    let link=document.getElementById("moonstonePageFont");
    if(!link){link=document.createElement("link");link.id="moonstonePageFont";link.rel="stylesheet";document.head.appendChild(link)}
    link.href="https://fonts.googleapis.com/css2?family="+encodeURIComponent(font).split("%20").join("+")+":wght@400;500;600;700&display=swap";
   }
  }else{
   document.documentElement.style.removeProperty("--site-font");
   document.getElementById("moonstonePageFont")?.remove();
  }
 }catch(e){document.body.dataset.theme="moonstone"}
}
applyMoonstoneSettings();
window.addEventListener("storage",e=>{if(e.key==="moonstone-settings")applyMoonstoneSettings()});

document.addEventListener("error",e=>{const img=e.target;if(!img.matches?.("img.thumb"))return;const id=img.dataset.videoId;if(!id)return;const stage=Number(img.dataset.fallbackStage||0);const fallbacks=["https://i.ytimg.com/vi/"+id+"/hqdefault.jpg","https://img.youtube.com/vi/"+id+"/0.jpg"];if(stage<fallbacks.length){img.dataset.fallbackStage=stage+1;img.src=fallbacks[stage]}else{img.style.opacity="0"}},true);
renderSubscriptions();home();
})();
