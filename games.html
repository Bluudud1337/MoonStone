<script>
(() => {
  const address = document.getElementById("moonstoneAddress");
  if (!address) return;
  const updateAddress = () => {
    const current = window.location.pathname + window.location.search + window.location.hash;
    address.value = current || "/";
  };
  updateAddress();
  window.addEventListener("popstate", updateAddress);
  document.getElementById("browserBack")?.addEventListener("click", () => window.history.back());
  document.getElementById("browserForward")?.addEventListener("click", () => window.history.forward());
  document.getElementById("browserReload")?.addEventListener("click", () => window.location.reload());
  address.addEventListener("focus", () => address.select());
  address.addEventListener("keydown", event => {
    if (event.key !== "Enter") return;
    let target = address.value.trim();
    if (!target) return;
    if (/^https?:\/\//i.test(target)) {
      try {
        const url = new URL(target);
        if (url.origin !== window.location.origin) {
          address.value = window.location.pathname + window.location.search + window.location.hash;
          return;
        }
        target = url.pathname + url.search + url.hash;
      } catch { return; }
    }
    if (!target.startsWith("/")) target = "/" + target;
    window.location.href = target;
  });
})();
</script>


<script>
(() => {
  const canvas = document.getElementById("cursorTrail");
  if (!canvas) return;
  const ctx = canvas.getContext("2d");
  const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
  const loadSettings = () => {
    try { return JSON.parse(localStorage.getItem("moonstone-settings") || "{}") || {}; }
    catch { return {}; }
  };
  let settings = loadSettings();
  let particles = [];
  let frame = null;
  let lastFrame = 0;

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    canvas.width = Math.round(window.innerWidth * dpr);
    canvas.height = Math.round(window.innerHeight * dpr);
    canvas.style.width = window.innerWidth + "px";
    canvas.style.height = window.innerHeight + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function update() {
    settings = loadSettings();
    const enabled = !!settings.cursorTrail && !reducedMotion.matches;
    canvas.style.display = enabled ? "block" : "none";
    if (enabled) {
      if (frame === null) frame = requestAnimationFrame(draw);
    } else {
      if (frame !== null) cancelAnimationFrame(frame);
      frame = null;
      particles = [];
      ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
    }
  }
  document.addEventListener("pointermove", event => {
    if (!settings.cursorTrail || reducedMotion.matches || event.pointerType === "touch") return;
    const color = getComputedStyle(document.body).getPropertyValue("--accent").trim() || "#d9d3bd";
    for (let i = 0; i < 2; i++) particles.push({
      x: event.clientX + (Math.random() - .5) * 8,
      y: event.clientY + (Math.random() - .5) * 8,
      r: Math.random() * 2.3 + 1, life: 1,
      decay: Math.random() * .035 + .025, color
    });
    if (particles.length > 140) particles.splice(0, particles.length - 140);
  }, {passive:true});
  function draw(timestamp = 0) {
    if (!settings.cursorTrail || reducedMotion.matches) { update(); return; }
    frame = null;
    if (timestamp - lastFrame >= 24) {
      lastFrame = timestamp;
      ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
      particles = particles.filter(p => p.life > 0);
      particles.forEach(p => {
        p.life -= p.decay;
        p.r *= .985;
        ctx.globalAlpha = Math.max(0, p.life) * .85;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.globalAlpha = 1;
    }
    frame = requestAnimationFrame(draw);
  }
  resize();
  window.addEventListener("resize", resize);
  window.addEventListener("storage", event => {
    if (event.key === "moonstone-settings" || event.key === null) update();
  });
  reducedMotion.addEventListener?.("change", update);
  update();
})();
</script>

</body>
</html>
