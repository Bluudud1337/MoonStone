<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#09090b">
  <title>MoonStone Browser</title>
  <link rel="stylesheet" href="/index.css">
  <script src="/scram/scramjet.all.js"></script>
  <script src="/baremux/index.js"></script>
  <script src="/register-sw.js"></script>
  <script src="/index.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/" aria-label="MoonStone Browser home"><span class="gem">✦</span><span>MoonStone</span><small>Browser</small></a>
    <div class="header-status"><span class="status-dot"></span><span id="status">Ready</span></div>
  </header>
  <main>
    <section class="welcome" id="welcome">
      <div class="orb">✦</div>
      <p class="eyebrow">A different way to explore</p>
      <h1>Find your next <em>somewhere.</em></h1>
      <p class="subtext">Search the web or enter a website address.</p>
      <form id="address-form" autocomplete="off">
        <span class="search-icon">⌕</span>
        <input id="address" type="text" placeholder="Search or enter a URL" aria-label="Search or enter a URL" autofocus>
        <button type="submit">Go <span>↗</span></button>
      </form>
      <p id="error" role="status"></p>
      <div class="quick-links" aria-label="Quick links">
        <button data-url="https://www.wikipedia.org/">Wikipedia</button>
        <button data-url="https://www.mozilla.org/">Mozilla</button>
        <button data-url="https://developer.mozilla.org/">MDN Web Docs</button>
      </div>
    </section>
    <section class="browser-stage" id="browser-stage" hidden>
      <div class="browser-toolbar">
        <button id="home" title="Home" aria-label="Home">⌂</button>
        <button id="back" title="Back" aria-label="Back">←</button>
        <button id="reload" title="Reload" aria-label="Reload">↻</button>
        <form id="nav-form"><input id="nav-address" aria-label="Current address" autocomplete="off"><button type="submit">Go</button></form>
        <button id="new-tab" title="New tab" aria-label="New tab">＋</button>
      </div>
      <div id="tabs" class="tabs" role="tablist" aria-label="Browser tabs"></div>
      <div id="view" class="view"></div>
    </section>
  </main>
  <footer><span>MoonStone Browser</span><span>Powered by Scramjet</span><a href="https://github.com/MercuryWorkshop/Scramjet-App" target="_blank" rel="noreferrer">Engine reference</a></footer>
</body>
</html>
